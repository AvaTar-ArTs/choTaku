name: choTaku verification

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      - run: python -m chotaku.cli examples/crimson-curse-master.json --output /tmp/chotaku-plan.json
      - run: python -m chotaku.cli examples/choosing-to-be-chosen.json --target manga --output /tmp/choosing-to-be-chosen-plan.json
